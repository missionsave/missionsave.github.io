<script>
	// 1. Função para acionar a ativação quando for preciso
function ativarCOIServiceWorker() {
    // Marca no localStorage que o COI foi solicitado
    localStorage.setItem('coi_state', 'pending');
    
    // Injeta o script dinamicamente
    const script = document.createElement('script');
    script.src = '/coi-serviceworker.min.js';
    document.head.appendChild(script);
}

// 2. Executa a verificação ao carregar a página
(function gerenciarCOI() {
    const estado = localStorage.getItem('coi_state');

    if (estado === 'pending') {
        // O script foi injetado e o COI fez/vai fazer o reload de ativação.
        // Mudamos o estado para 'active_once' para desligar no próximo reload.
        localStorage.setItem('coi_state', 'active_once');
        
        const script = document.createElement('script');
        script.src = '/coi-serviceworker.min.js';
        document.head.appendChild(script);
        
    } else if (estado === 'active_once') {
        // Já passou pelo reload necessário. Agora desregistramos o Service Worker
        // e limpamos a flag para que volte ao estado normal no próximo reload.
        localStorage.removeItem('coi_state');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (let registration of registrations) {
                    registration.unregister();
                    console.log('COI Service Worker desregistrado com sucesso.');
                }
            });
        }
    }
})();

ativarCOIServiceWorker();
</script>

    <script>
        // OffscreenCanvas polyfill protection for Emscripten
        (function() {
            if (typeof OffscreenCanvasRenderingContext2D !== 'undefined') {
                const originalGet = Object.getOwnPropertyDescriptor(OffscreenCanvasRenderingContext2D.prototype, 'canvas').get;
                Object.defineProperty(OffscreenCanvasRenderingContext2D.prototype, 'canvas', {
                    get: originalGet,
                    set: function(val) {
                        console.warn("Emscripten tried to overwrite read-only 'canvas' property. Handled successfully.");
                    },
                    configurable: true,
                    enumerable: true
                });
            }
        })();
