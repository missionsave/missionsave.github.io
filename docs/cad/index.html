async function ativarCOI() {
  // Já isolado: nada a fazer
  if (window.crossOriginIsolated) {
    console.log('COI já está ativo.');
    return;
  }

  // Sem suporte a service workers (ex: contexto não seguro)
  if (!('serviceWorker' in navigator)) {
    console.warn('Service Workers não suportados; COI indisponível.');
    return;
  }

  // Já fez 1 reload e continua sem isolamento: não repete (evita loop)
  if (sessionStorage.getItem('coi_reloaded') === 'true') {
    console.warn('COI não ficou ativo após o reload.');
    return;
  }

  // 1. Carrega o script do coi-serviceworker e espera
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = '/coi-serviceworker.min.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error('Falha ao carregar coi-serviceworker'));
    document.head.appendChild(script);
  });

  // 2. Espera que o service worker esteja registado e ativo
  const registration = await navigator.serviceWorker.ready;

  if (registration.active) {
    // 3. Um único reload, já com o SW no browser
    sessionStorage.setItem('coi_reloaded', 'true');
    location.reload();
  }
}

// 2. Desativa, remove o Service Worker e limpa o estado
function desativarCOI() {
    // localStorage.removeItem('coi_active');

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
                if (registration.active && registration.active.scriptURL.includes('coi-serviceworker')) {
                    registration.unregister();
                    console.log('COI Service Worker desregistrado.');
                }
            }
        });
    }

    // location.reload();
}

    <script>
        // OffscreenCanvas polyfill protection for Emscripten
        (function() {
            if (typeof OffscreenCanvasRenderingContext2D !== 'undefined') {
                const originalGet = Object.getOwnPropertyDescriptor(OffscreenCanvasRenderingContext2D.prototype, 'canvas').get;
                Object.defineProperty(OffscreenCanvasRenderingContext2D.prototype, 'canvas', {
                    get: originalGet,
                    set: function(val) {
                        console.warn("Emscripten tried to overwrite read-only 'canvas' property. Handled successfully.");
                    },
                    configurable: true,
                    enumerable: true
                });
            }
        })();
    </script>
