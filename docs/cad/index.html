<!-- 1. Configuração para evitar loops de reload -->
<script>
  window.coi = {
    // Evita registar ou recarregar se o script já tiver provocado um reload nesta sessão
    shouldRegister: () => !window.reloadedBySelf,
    coepCredentialless: () => true // Recomendado para compatibilidade de recursos
  };

  // 2. Função que bloqueia a execução até que o ambiente esteja pronto
  function aguardarIsolamento() {
    return new Promise((resolve) => {
      if (window.crossOriginIsolated) {
        // Se já está isolado (segunda visita ou após o reload), continua imediatamente
        resolve();
      } else {
        // Se não está isolado, monitoriza o Service Worker. 
        // Nota: Se for o primeiro acesso, a página irá recarregar e o fluxo recomeça do topo.
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(() => {
            if (window.crossOriginIsolated) {
              resolve();
            }
          });
        }
      }
    });
  }
</script>

<!-- Inserção dinâmica do script do COI com o domínio atual -->
<script>
  (function() {
    // 1. Obtém o domínio atual com protocolo (ex: http://127.0.0.1:5500 ou https://meusite.com)
    const dominioActual = window.location.origin;

    // 2. Cria o elemento script
    const script = document.createElement('script');
    
    // 3. Define os atributos necessários
    script.src = `${dominioActual}/coi-serviceworker.min.js`;
    script.defer = true;

    // 4. Adiciona o script ao documento (no final do body ou head)
    document.body.appendChild(script);
    
    console.log(`Script COI injetado dinamicamente para: ${script.src}`);
  })();
</script>

    <script>
        // OffscreenCanvas polyfill protection for Emscripten
        (function() {
            if (typeof OffscreenCanvasRenderingContext2D !== 'undefined') {
                const originalGet = Object.getOwnPropertyDescriptor(OffscreenCanvasRenderingContext2D.prototype, 'canvas').get;
                Object.defineProperty(OffscreenCanvasRenderingContext2D.prototype, 'canvas', {
                    get: originalGet,
                    set: function(val) {
                        console.warn("Emscripten tried to overwrite read-only 'canvas' property. Handled successfully.");
                    },
                    configurable: true,
                    enumerable: true
                });
            }
        })();
    </script>
