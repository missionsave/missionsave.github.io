<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASM App</title>
  <style>
	html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #1a1a1a;
  /* Centraliza o canvas na tela */
  display: flex;
  align-items: center;
  justify-content: center;
}

#canvas {
  width: 100vw;
  height: 100vh;
  /* Mantém a proporção exata da resolução do Raylib/WebGL sem esticar */
  object-fit: contain;
  border: none;
  outline: none;
}
  </style>
</head>
<body>
  <!-- Canvas element bound to Emscripten -->
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var Module = {
      canvas: (function() {
        return document.getElementById('canvas');
      })()
    };
  </script>
  <!-- Load the Emscripten glue script generated by em++ -->
  <script async src="app.js"></script>
</body>
</html>
